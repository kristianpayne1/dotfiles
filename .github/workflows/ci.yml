# Install on fresh Linux (with and without sudo) and macOS, then check the result with verify.sh.
# Weekly too, to catch a pinned download that moved or broke upstream.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck install.sh scripts/*.sh scripts/hooks/pre-commit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (whole history)
        run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner

  linux:
    strategy:
      fail-fast: false
      matrix:
        profile: [full, editor]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/test-linux.sh ${{ matrix.profile }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the runner already has Node, Python and Rust, so this also checks they're kept
      - name: Install (full profile)
        run: ./install.sh --full
      - name: Verify in a new login shell
        run: bash -lic ./scripts/verify.sh
      - name: Re-run changes nothing and the repo stays untouched
        run: |
          if ./install.sh --full 2>&1 | grep -E 'linked|moved|updated .* block|added'; then
            echo "re-run changed something"; exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "repo changed:"; git status --porcelain; git diff; exit 1
          fi
