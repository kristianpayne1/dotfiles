# Language runtimes for `install.sh --full` (mise reads this when MISE_ENV=full). install.sh
# skips any of these that already exist on the machine unless you choose mise's, so it never
# silently replaces a work-managed Node, Python or Rust. Node itself is in config.toml.
[tools]
pnpm = "12.15.0"
python = "3.15.0"
uv = "0.13.5"
rust = "1.99.1"
